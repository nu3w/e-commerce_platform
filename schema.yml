components:
  schemas:
    Cart:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer:
          type: integer
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - customer
      - id
      - items
      - total_price
      - updated_at
    CartItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
        product_name:
          type: string
          readOnly: true
        product_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        added_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - added_at
      - id
      - product
      - product_name
      - product_price
      - subtotal
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
      required:
      - id
      - name
    Delivery:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        order:
          type: integer
        customer_name:
          type: string
          readOnly: true
        order_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        delivery_person:
          type: integer
        delivery_person_name:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/DeliveryStatusEnum'
        assigned_at:
          type: string
          format: date-time
          readOnly: true
        delivered_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - assigned_at
      - customer_name
      - delivered_at
      - delivery_person
      - delivery_person_name
      - id
      - order
      - order_total
    DeliveryStatusEnum:
      enum:
      - assigned
      - picked
      - delivering
      - delivered
      type: string
      description: |-
        * `assigned` - Assigned
        * `picked` - Picked Up
        * `delivering` - Out for Delivery
        * `delivered` - Delivered
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - password
      - username
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
